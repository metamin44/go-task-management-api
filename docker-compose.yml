# Application stack ONLY: one-shot migrate + API.
#
# The PostgreSQL container (task-management-db, postgres:17-alpine, volume
# task-management-postgres-data, 127.0.0.1:5432) is managed separately and is
# deliberately NOT defined here — this file never creates, recreates, or
# removes databases, volumes, or networks. Containers reach the existing
# host-bound database via host.docker.internal (Docker Desktop). On a Linux
# host where PostgreSQL binds only to 127.0.0.1, attach the API to the host
# network or rebind PostgreSQL deliberately instead.
#
# Secrets: DB_PASSWORD is interpolated from the environment or the gitignored
# project .env (Compose reads it at runtime; never commit values).
# AUTH_ACCESS_SECRET must be provided explicitly (>= 32 bytes), e.g.
#   export AUTH_ACCESS_SECRET="$(openssl rand -base64 48)"
# Missing required secrets fail startup safely via the :? checks below.

name: task-management-api

services:
  migrate:
    build: .
    image: task-management-api:local
    entrypoint: ["/app/migrate"]
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      DB_NAME: task_management
      DB_USER: app_user
      # Local container has no TLS. Production deployments MUST use verify-full.
      DB_SSLMODE: disable
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in the environment or .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  api:
    build: .
    image: task-management-api:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      HTTP_PORT: "8080"
      HTTP_READ_TIMEOUT: 5s
      HTTP_WRITE_TIMEOUT: 10s
      HTTP_IDLE_TIMEOUT: 60s
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      DB_NAME: task_management
      DB_USER: app_user
      DB_SSLMODE: disable
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in the environment or .env}
      DB_MAX_CONNS: "10"
      DB_MIN_CONNS: "0"
      DB_MAX_CONN_LIFETIME: 30m
      AUTH_ACCESS_SECRET: ${AUTH_ACCESS_SECRET:?AUTH_ACCESS_SECRET must be set (at least 32 bytes)}
      AUTH_ACCESS_TTL: 15m
      AUTH_REFRESH_TTL: 720h
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s